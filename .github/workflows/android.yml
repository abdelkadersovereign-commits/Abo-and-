name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1
        cache-disabled: true

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: "🔑 Print SHA-1 — COPY THIS AND ADD TO FIREBASE CONSOLE"
      if: always()
      run: |
        echo "=================================================================="
        echo "  STEP: Add this SHA-1 to Firebase Console for Google Sign-In    "
        echo "  Path: Firebase Console → Project Settings → Your App → Add fingerprint"
        echo "=================================================================="
        if [ -f "$HOME/.android/debug.keystore" ]; then
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -A2 "Certificate fingerprints"
        else
          echo "Generating debug keystore..."
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -A2 "Certificate fingerprints"
        fi
        echo "=================================================================="

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asyria-sentinel-debug
        path: app/build/outputs/apk/debug/app-debug.apk
