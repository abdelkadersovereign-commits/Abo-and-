name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1
        cache-disabled: true

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, using gradle installed by action"
          gradle assembleDebug
        fi

    - name: Print debug keystore SHA-1 (add to Firebase Console for Google Sign-In)
      if: always()
      run: |
        echo "================================================"
        echo "  DEBUG KEYSTORE SHA-1 — ADD THIS TO FIREBASE  "
        echo "================================================"
        keytool -list -v \
          -keystore "$HOME/.android/debug.keystore" \
          -alias androiddebugkey \
          -storepass android \
          -keypass android 2>/dev/null | grep -E "SHA1:|SHA-1:" | head -1
        echo "================================================"
        echo "Go to Firebase Console → Project Settings → Your App → Add fingerprint"
        echo "================================================"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asyria-sentinel-debug
        path: app/build/outputs/apk/debug/app-debug.apk
